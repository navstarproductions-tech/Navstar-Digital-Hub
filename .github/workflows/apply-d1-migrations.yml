name: Apply Navstar D1 migrations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-d1-migrations.yml'
      - 'db/migrations/**'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type APPLY to confirm applying pending migrations to the production D1 database"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ github.event_name == 'push' || inputs.confirm_production == 'APPLY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Resolve production D1 database and create temporary Wrangler config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          database_id="$(printf '%s' "$response" | jq -r '[.result[] | select(.name == "navstar-digital-hub")][0].uuid // empty')"
          if [ -z "$database_id" ]; then
            echo "Could not find D1 database named navstar-digital-hub in the configured Cloudflare account."
            printf '%s' "$response" | jq -r '.errors[]?.message'
            exit 1
          fi
          jq -n --arg id "$database_id" '{
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "navstar-digital-hub-migrations",
            "compatibility_date": "2026-11-16",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "navstar-digital-hub",
              "database_id": $id,
              "migrations_dir": "db/migrations"
            }]
          }' > wrangler.migrations.jsonc
          echo "Resolved the production D1 database and prepared the migration configuration."

      - name: Apply pending production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.migrations.jsonc
